<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Red Pocket</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- LibTL Ads SDK -->
<script src="//libtl.com/sdk.js"
data-zone="11704575"
data-sdk="show_11704575"></script>


<style>

body{
margin:0;
background:linear-gradient(135deg,#ff2525,#800000);
font-family:Arial;
color:white;
text-align:center;
}

.app{
padding:20px;
max-width:400px;
margin:auto;
}

.card{
background:#ffffff22;
padding:15px;
border-radius:15px;
margin:15px 0;
}

.box{
width:180px;
height:220px;
background:#d60000;
margin:30px auto;
border-radius:20px;
font-size:70px;
padding-top:60px;
box-shadow:0 10px 30px #0008;
animation:move 2s infinite;
}

@keyframes move{
50%{transform:translateY(-10px);}
}

button{
width:90%;
padding:15px;
margin:8px;
border:0;
border-radius:30px;
background:#ffd700;
font-size:18px;
font-weight:bold;
}

input{
width:85%;
padding:12px;
border-radius:20px;
border:0;
margin:5px;
}

</style>

</head>


<body>


<div class="app">


<h1>🧧 Red Pocket</h1>


<div class="card">

💰 Balance

<h2 id="balance">0</h2>

</div>



<div class="box">
🧧
</div>



<button onclick="dailyClaim()">
🎁 Daily Claim
</button>


<button onclick="watchAd()">
📺 Watch Ad +50
</button>



<div class="card">

👥 Referral

<p id="ref"></p>

<button onclick="copyRef()">
Copy Link
</button>

</div>



<div class="card">

<h3>💸 Withdraw</h3>

<input id="amount" placeholder="Amount">

<input id="wallet" placeholder="Wallet Address">

<button onclick="withdraw()">
Submit
</button>

</div>



<p id="msg"></p>


</div>



<script>


let tg=window.Telegram.WebApp;

tg.expand();


let user=tg.initDataUnsafe.user;


let id=user ? user.id : "demo";



let balance=
Number(localStorage.balance || 0);



document.getElementById("balance").innerHTML=
balance;



let referral=
"https://t.me/Red_box3_bot?start="+id;



document.getElementById("ref").innerHTML=
referral;



function save(){

localStorage.balance=balance;

}



// Daily reward

function dailyClaim(){


let last=
Number(localStorage.lastClaim || 0);


if(Date.now()-last < 86400000){

msg.innerHTML=
"⏳ Already claimed";

return;

}


let reward=
Math.floor(Math.random()*100)+20;


balance+=reward;


localStorage.lastClaim=Date.now();


save();


show(
"🎉 Daily +"+reward
);


}




// LibTL Ad

function watchAd(){


if(typeof show_11704575 === "function"){


show_11704575();



setTimeout(()=>{


balance+=50;


save();


show(
"📺 Ad Reward +50"
);


},3000);



}

else{


show(
"Ad loading..."
);


}


}





function withdraw(){


let amount=
document.getElementById("amount").value;


let wallet=
document.getElementById("wallet").value;



if(!amount || !wallet){

show("Fill all fields");

return;

}



show(
"✅ Withdraw request sent"
);



}




function copyRef(){

navigator.clipboard.writeText(referral);

show(
"Referral copied"
);

}



function show(t){

document.getElementById("msg").innerHTML=t;

document.getElementById("balance").innerHTML=balance;

}


</script>


</body>
</html>
